# Supervised fine-tuning (SFT): turn the Saffron base model into an
# instruction-follower. Initializes from the pretrained base checkpoint and
# trains only on assistant-response tokens. Uses the SAME tokenizer as the base.
#
#   1) python -m src.data.prepare_sft --config configs/sft.yaml
#   2) python -m src.train_sft       --config configs/sft.yaml
#   3) python -m src.chat            --config configs/sft.yaml
block_size: 512
tokenizer_dir: tokenizer

base_ckpt: results/saffron.pt      # pretrained base to fine-tune (download from HF if missing)
datasets:
  # instruction / (optional) input / output field names per source
  - {key: dolly,  path: databricks/databricks-dolly-15k, instruction: instruction, input: context, output: response}
  - {key: alpaca, path: tatsu-lab/alpaca,                 instruction: instruction, input: input,   output: output}
max_examples: 60000
val_fraction: 0.01

batch_size: 16
grad_accum: 4                 # effective batch = 64
max_iters: 1500               # ~1-3 epochs over the SFT data; watch val loss
warmup_iters: 100
lr: 0.00002                   # low LR for fine-tuning (2e-5)
min_lr: 0.000002
weight_decay: 0.0
grad_clip: 1.0
amp: true
amp_dtype: bfloat16           # A10G/A100/L4. Use float16 on a T4.
eval_interval: 200
ckpt_interval: 200
eval_iters: 100

data_dir: data
out_dir: results
seed: 1337
